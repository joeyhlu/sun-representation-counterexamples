name: verify

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  python:
    name: Re-check every counterexample (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python verify.py --quick
      - run: for N in 68211369278 273299806988; do python check_cert_a303932.py $N certificates/A303932_conj2_N$N.csv nr; done
      - run: for N in 257558146370 749360555468 799324864730; do python check_cert_a303932.py $N certificates/A303932_conj1_N$N.csv qr; done
      - run: python check_cert_a157242.py certificates/A157242_N107576474238337.csv
      - run: python check_cert_a300510.py certificates/A300510_n80397893435.csv
      - run: python check_cert_a300510.py certificates/A300448_conj1_n80397893435.csv 1 1,2,5 80397893435
      - run: python check_cert_a300510.py certificates/A300448_conj2_n239694783.csv 1 1,5,17 239694783
      - run: for N in 68136270467 80570407837; do python check_cert_a300510.py certificates/A300448_conj3_n$N.csv 1 1,5,65 $N; done
      - run: for N in 386749710995 985224034231 1241790594939 1572550146081 9224999068015; do python check_cert_a300510.py certificates/A301452_n$N.csv 2 2,3 $N; done

  lean:
    name: Check the Lean proofs (A157242 and A303932, Conjecture 2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean (elan)
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check that the Lean files match the certificates
        run: |
          python lean/gen_lean.py certificates/A303932_conj2_N68211369278.csv /tmp/regen.lean
          diff /tmp/regen.lean lean/SunA303932.lean
          python lean/gen_lean_a157242.py certificates/A157242_N107576474238337.csv /tmp/regen2.lean
          diff /tmp/regen2.lean lean/SunA157242.lean
      - name: Lean kernel check (A303932, Conjecture 2)
        working-directory: lean
        run: lean SunA303932.lean
      - name: Lean kernel check (A157242)
        working-directory: lean
        run: lean SunA157242.lean
